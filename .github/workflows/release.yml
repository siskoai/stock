name: Publication

# Déclenchée par un tag de version. Construit les trois exécutables, puis les
# joint à une version GitHub dont le corps reprend la section correspondante
# du journal des versions.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à publier, par exemple v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.nom }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            nom: Linux
            drapeaux: ''
            archive: comptoir-linux-amd64.tar.gz
          - os: windows-latest
            nom: Windows
            drapeaux: '-nsis'
            archive: comptoir-windows-amd64-installer.exe
          - os: macos-latest
            nom: macOS
            drapeaux: '-platform darwin/universal'
            archive: comptoir-macos-universal.zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Dépendances système (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Installer Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Déterminer la version
        id: version
        shell: bash
        run: |
          version="${{ github.event.inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME}"; fi
          echo "numero=${version#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - name: Compiler
        shell: bash
        run: |
          wails build -clean ${{ matrix.drapeaux }} \
            -ldflags "-X main.version=${{ steps.version.outputs.numero }}"

      # Signature Developer ID, si le certificat est configuré en secret. Sans
      # lui, l'application garde sa signature ad hoc : macOS la considère comme
      # provenant d'un développeur non identifié, ce qui reste ouvrable par un
      # clic droit. Voir la section macOS du README.
      - name: Signer et faire certifier par Apple
        if: runner.os == 'macOS' && env.CERTIFICAT != ''
        env:
          CERTIFICAT: ${{ secrets.MACOS_CERTIFICATE }}
          MOT_DE_PASSE: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITE: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_MDP: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_EQUIPE: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          trousseau="$RUNNER_TEMP/signature.keychain-db"
          motpasse=$(uuidgen)
          security create-keychain -p "$motpasse" "$trousseau"
          security set-keychain-settings -lut 900 "$trousseau"
          security unlock-keychain -p "$motpasse" "$trousseau"
          echo "$CERTIFICAT" | base64 --decode > "$RUNNER_TEMP/certificat.p12"
          security import "$RUNNER_TEMP/certificat.p12" -k "$trousseau" \
            -P "$MOT_DE_PASSE" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$motpasse" "$trousseau"
          security list-keychain -d user -s "$trousseau"

          codesign --force --deep --timestamp --options runtime \
            --sign "$IDENTITE" build/bin/comptoir.app

          # La certification porte sur une archive, pas sur le dossier.
          ditto -c -k --keepParent build/bin/comptoir.app "$RUNNER_TEMP/soumission.zip"
          xcrun notarytool submit "$RUNNER_TEMP/soumission.zip" \
            --apple-id "$APPLE_ID" --password "$APPLE_MDP" --team-id "$APPLE_EQUIPE" --wait
          # L'agrafage inscrit le ticket dans le bundle : l'ouverture ne
          # nécessite alors plus de connexion.
          xcrun stapler staple build/bin/comptoir.app
          security delete-keychain "$trousseau"

      # Une signature invalide fait présenter l'application comme « endommagée »
      # par macOS, et le clic droit ne la débloque même pas. Le défaut est
      # invisible sur le poste qui compile : il ne se révèle qu'après
      # téléchargement. On le rattrape donc ici, avant publication.
      - name: Vérifier la signature
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict --verbose=2 build/bin/comptoir.app
          echo "Architectures :"
          lipo -archs build/bin/comptoir.app/Contents/MacOS/Comptoir
          echo "Exécutable déclaré :"
          plutil -extract CFBundleExecutable raw build/bin/comptoir.app/Contents/Info.plist

      # Une application macOS est un dossier : elle doit être compressée pour
      # traverser un téléchargement sans perdre son bit d'exécution.
      - name: Empaqueter
        shell: bash
        run: |
          cd build/bin
          echo "Produit par la compilation :"
          ls -la
          case "${{ runner.os }}" in
            Linux)
              binaire=$(find . -maxdepth 1 -type f -executable -print -quit)
              [ -n "$binaire" ] || { echo "aucun exécutable produit"; exit 1; }
              tar -czf "${{ matrix.archive }}" "$(basename "$binaire")"
              ;;
            macOS)
              app=$(find . -maxdepth 1 -name '*.app' -print -quit)
              [ -n "$app" ] || { echo "aucune application produite"; exit 1; }
              ditto -c -k --keepParent "$app" "${{ matrix.archive }}"
              ;;
            Windows)
              installeur=$(find . -maxdepth 1 -name '*installer*.exe' -print -quit)
              [ -n "$installeur" ] || { echo "l'installeur NSIS n'a pas été produit"; exit 1; }
              mv "$installeur" "${{ matrix.archive }}"
              ;;
          esac
          ls -la "${{ matrix.archive }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: build/bin/${{ matrix.archive }}
          if-no-files-found: error

  publier:
    name: Publier la version
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artefacts
          merge-multiple: true

      - name: Extraire la section du journal des versions
        id: notes
        run: |
          version="${{ github.event.inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME}"; fi
          numero="${version#v}"
          # Du titre de la version jusqu'au titre suivant, exclu.
          awk -v v="## [$numero]" '
            index($0, v) == 1 { dans = 1; next }
            dans && /^## \[/    { exit }
            dans                { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "Aucune section « $numero » dans CHANGELOG.md" >&2
            exit 1
          fi
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - name: Empreintes des fichiers
        run: |
          cd artefacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Créer la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.notes.outputs.tag }}" \
            artefacts/* \
            --title "Comptoir ${{ steps.notes.outputs.tag }}" \
            --notes-file notes.md \
            --verify-tag
